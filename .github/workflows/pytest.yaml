name: pytest

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.11", "3.14"]' || '["3.11", "3.12", "3.13", "3.14"]') }}
    name: pytest (python ${{ matrix.python-version }})
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-extras --group dev
      - name: Run tests
        run: uv run pytest tests/

  sdk-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { provider: openai, sdk: "openai==1.66.0" }
          - { provider: openai, sdk: "openai>=1.66,<2" }
          - { provider: openai, sdk: "openai==2.0.0" }
          - { provider: openai, sdk: "openai>=2,<3" }
          - { provider: openai, sdk: "openai==3.0.0" }
          - { provider: cohere, sdk: "cohere==5.13.12" }
          - { provider: cohere, sdk: "cohere>=5.13.12,<6" }
          - { provider: cohere, sdk: "cohere==6.0.0" }
          - { provider: cohere, sdk: "cohere>=6,<7" }
          - { provider: cohere, sdk: "cohere==7.0.0" }
          - { provider: anthropic, sdk: "anthropic==0.45.2" }
          - { provider: anthropic, sdk: "anthropic>=0.45.2,<1" }
          - { provider: anthropic, sdk: "anthropic==1.0.0" }
          - { provider: anthropic, sdk: "anthropic>=1,<2" }
          - { provider: anthropic, sdk: "anthropic==2.0.0" }
          - { provider: mistralai, sdk: "mistralai==1.5.0" }
          - { provider: mistralai, sdk: "mistralai>=1.5,<2" }
          - { provider: mistralai, sdk: "mistralai==2.0.0" }
          - { provider: mistralai, sdk: "mistralai>=2,<3" }
          - { provider: mistralai, sdk: "mistralai==3.0.0" }
          - { provider: google_genai, sdk: "google-genai==1.26.0" }
          - { provider: google_genai, sdk: "google-genai>=1.26,<2" }
          - { provider: google_genai, sdk: "google-genai==2.0.0" }
          - { provider: google_genai, sdk: "google-genai>=2,<3" }
          - { provider: google_genai, sdk: "google-genai==3.0.0" }
          - { provider: huggingface_hub, sdk: "huggingface-hub==0.28.1" }
          - { provider: huggingface_hub, sdk: "huggingface-hub>=0.28.1,<1" }
          - { provider: huggingface_hub, sdk: "huggingface-hub==1.0.0" }
          - { provider: huggingface_hub, sdk: "huggingface-hub>=1,<2" }
          - { provider: huggingface_hub, sdk: "huggingface-hub==2.0.0" }
          - { provider: huggingface_hub, sdk: "huggingface-hub>=2,<3" }
    name: SDK compatibility (${{ matrix.sdk }})
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Run provider integration tests
        run: uv run --isolated --locked --extra '${{ matrix.provider }}' --extra opentelemetry --with '${{ matrix.sdk }}' python -m pytest tests/test_${{ matrix.provider }}*.py
