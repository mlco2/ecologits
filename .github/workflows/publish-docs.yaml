name: publish-docs

on:
  push:
    branches:
      - main
    tags:
      - '**'

permissions:
  contents: read

concurrency:
  group: publish-docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push to gh-pages
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --only-group docs

      - name: Build docs
        run: uv run zensical build -f mkdocs.yml --clean --strict

      - name: Check documentation links
        run: uv run python scripts/check_docs_links.py site

      # deploy github pages (dev)
      - name: Deploy GitHub Pages (dev)
        if: "github.ref == 'refs/heads/main'"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/deploy-docs.sh dev

      # deploy github pages (release)
      - if: startsWith(github.ref, 'refs/tags/')
        id: check-version
        uses: samuelcolvin/check-python-version@v4.1
        with:
          version_file_path: 'ecologits/__init__.py'
          skip_env_check: true

      - name: Deploy GitHub Pages (release)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/deploy-docs.sh ${{ steps.check-version.outputs.VERSION_MAJOR_MINOR }} latest
