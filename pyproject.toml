[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecologits"
version = "0.12.0"
description = "EcoLogits tracks and estimates the energy consumption and environmental impacts of using generative AI models through APIs."
authors = [
    {name = "Samuel Rincé"},
    {name = "Adrien Banse"},
]
license = "MPL-2.0"
readme = "README.md"
homepage = "https://ecologits.ai"
repository = "https://github.com/mlco2/ecologits"
documentation = "https://ecologits.ai"
classifiers = [
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Topic :: Internet",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: OS Independent",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.11,<4"
dependencies = [
    "wrapt>=1.14.1,<3.0.0",
    "pydantic>=1.9.0,<3",
    "packaging>=24.2",
]

[project.optional-dependencies]
openai = ["openai>=1.66.0,<4.0.0"]
mistralai = ["mistralai>=1.5.0,<4.0.0"]
anthropic = ["anthropic>=0.45.2,<3.0.0"]
cohere = ["cohere>=5.13.12,<8.0.0"]
huggingface-hub = [
    "huggingface-hub>=0.28.1,<3.0.0",
    "aiohttp>=3.14.4",  # Required by AsyncInferenceClient in huggingface-hub 0.x.
    "tiktoken>=0.8.0,<0.15.0",
    "minijinja>=2.7.0,<3.0.0",
]
google-genai = ["google-genai>=1.26.0,<4.0.0"]
litellm = [
    "litellm>=1.83.10,<2.0.0",
    "aiohttp>=3.14.4",
    "rapidfuzz>=3.12.1,<4.0.0",
]
opentelemetry = [
    "opentelemetry-api>=1.45.2,<2.0.0",
    "opentelemetry-sdk>=1.45.2,<2.0.0",
    "opentelemetry-exporter-otlp>=1.45.2,<2.0.0",
    "tiktoken>=0.8.0,<0.15.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=7.2.0",
    "pytest-recording>=0.13.1",
    "vcrpy>=9.4.2",
    "pytest-dotenv>=0.5.2",
    "pytest-asyncio>=0.23.6",
    "numpy>=2.0.0",
    "toml>=0.10.2",
    "mypy>=1.13.0",
    "setuptools>=84.1.0",
]
docs = [
    "zensical>=0.1.1",
    "mkdocstrings[python]>=0.26",
    "mkdocs-autorefs>=1.0.1",
    "requests>=2.32.0",
    "beautifulsoup4>=4.14.3",
]

[tool.uv]
exclude-newer = "2 days"
constraint-dependencies = [
    "filelock>=4.2.1",
    "pyasn1>=0.6.5",
    "virtualenv>=21.14.9",
]

# soupsieve>=4 (fixes GHSA-mmhr-3c5m-f64f) needs Python 3.11.5; the docs only build in CI.
[tool.uv.dependency-groups]
docs = { requires-python = ">=3.11.5" }

[pytest]
env_files = [".env"]

[tool.mypy]
exclude = [
    "ecologits/impacts/*",
    "ecologits/tracers/*"
]

[[tool.mypy.overrides]]
module = "docs.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "requests"
ignore_missing_imports = true


[tool.ruff]
select = [
    "A",
    "ANN",
    "ARG",
    "B",
    "C",
    "COM",
    "C90",
    "E",
    "ERA",
    "F",
    "I",
    "N",
    "PGH",
    "PL",
    "PLE",
    "PLR",
    "PLW",
    "PT",
    "PTH",
    "Q",
    "RET",
    "RUF",
    "SLF",
    "SIM",
    "TID",
    "TRY",
    "UP",
    "W",
    "YTT"
]

ignore = [
    "A003",
    "ANN401",
    "N805",
    "N818",
    "PLR0913",
    "RET504",
    "RET505",
    "COM812",
    "PTH",
    "TRY003"
]

fixable = [
    "A",
    "ANN",
    "ARG",
    "B",
    "C",
    "COM",
    "C90",
    "E",
    "ERA",
    "F",
    "I",
    "PGH",
    "PL",
    "PLE",
    "PLR",
    "PLW",
    "PT",
    "PTH",
    "Q",
    "RET",
    "RUF",
    "SLF",
    "SIM",
    "TID",
    "TRY",
    "UP",
    "W",
    "YTT"
]
unfixable = []

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "venv",
    "pages",
    "tests"
]

line-length = 120

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

target-version = "py39"

[tool.ruff.per-file-ignores]
# Copied from mlco2/codecarbon; keep it close to the source.
"scripts/check_docs_links.py" = ["C901", "PLR0911", "PLR0912", "PLR2004", "SIM108", "TRY300"]

[tool.ruff.mccabe]
max-complexity = 10

[tool.ruff.pydocstyle]
convention = "google"
