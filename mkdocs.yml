site_name: EcoLogits
site_description: Track and estimate the environmental impacts of generative AI models - Official Documentation
# Docs are served under /latest/ (scripts/deploy-docs.sh); canonical and sitemap URLs use this path.
site_url: https://ecologits.ai/latest/
repo_name: mlco2/ecologits
repo_url: https://github.com/mlco2/ecologits
edit_uri: edit/main/docs/
copyright: "&copy; EcoLogits"

nav:
  - 'Home': index.md
  - 'Get Started':
    - 'Welcome to EcoLogits': get_started.md
    - 'Why use EcoLogits': why.md
    - 'Supported providers': tutorial/providers.md
    - 'FAQ': faq.md
    - 'Contributing': contributing.md
  - 'Tutorial':
      - 'Introduction': tutorial/index.md
      - 'Environmental Impacts': tutorial/impacts.md
      - 'Text Generation': tutorial/text_generation.md
      - 'Video Generation': tutorial/video_generation.md
      - 'Warnings and Errors': tutorial/warnings_and_errors.md
      - 'Supported providers': tutorial/providers.md
      - 'OpenTelemetry': tutorial/opentelemetry.md
      - 'Providers':
          - 'Anthropic': tutorial/providers/anthropic.md
          - 'ByteDance': tutorial/providers/bytedance.md
          - 'Cohere': tutorial/providers/cohere.md
          - 'Google Gemini': tutorial/providers/google_genai.md
          - 'Hugging Face Hub': tutorial/providers/huggingface_hub.md
          - 'Kling AI': tutorial/providers/klingai.md
          - 'LiteLLM': tutorial/providers/litellm.md
          - 'Mistral AI': tutorial/providers/mistralai.md
          - 'OpenAI': tutorial/providers/openai.md
          - 'Runway': tutorial/providers/runway.md
  - 'Methodology':
      - 'Introduction': methodology/index.md
      - 'Proprietary models': methodology/proprietary_models.md
      - 'LLM Inference': methodology/llm_inference.md
      - 'Video Generation': methodology/video_generation.md
  - 'Blog':
      - blog/index.md
  - 'EcoLogits Calculator': 'https://calculator.ecologits.ai/'
  - 'EcoLogits API': 'https://api.ecologits.ai/docs'
  - 'EcoLogits.js': 'https://www.npmjs.com/package/@ecologits/ecologits.js'

theme:
  variant: modern
  custom_dir: overrides
  logo: assets/leaf.svg
  favicon: assets/leaf.svg
  font:
    text: Roboto
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: lucide/sun
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: lucide/moon
        name: Switch to light mode
  features:
    - announce.dismiss
    - content.action.copy
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.footnote.tooltips
    - content.tabs.link
    - content.tooltips
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.preview
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.highlight
    - toc.follow
  icon:
    github: mlco2/ecologits

extra:
  version:
    alias: true
    provider: mike
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mlco2
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/ecologits/
      name: LinkedIn
    - icon: fontawesome/brands/discord
      link: https://discord.gg/CAecQ2zM4n
      name: Discord

extra_css:
  - css/extra.css
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.7/katex.min.css

extra_javascript:
  - js/katex.js
  - js/installer.js
  - js/clipboard_copy.js
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.7/katex.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.7/contrib/auto-render.min.js

watch:
  - docs
  - ecologits

plugins:
  - search
  - social:
      cards_layout_options:
        background_color: "#0b3b36"
  - autorefs
  - api-autonav:
      modules: [ecologits]
  - mkdocstrings:
      handlers:
        python:
          paths: [ . ]
          options:
            members_order: source
            docstring_style: google
            docstring_options:
              ignore_init_summary: yes
            merge_init_into_class: yes
            inherited_members: true
  - mike:
      canonical_version: latest
  - blog
  - glightbox
  - privacy:
      # The default fetches every optional theme library (about 9 MB). KaTeX stays on
      # cdnjs: it loads its fonts relative to its own URL, which a copied script breaks.
      assets_include:
        - unpkg.com/glightbox@*
        - fonts.googleapis.com/*
        - fonts.gstatic.com/*
  - meta-descriptions
  - llmstxt:
      base_url: https://ecologits.ai/latest/
      sections:
        Get started:
          - index.md
          - get_started.md
          - why.md
          - faq.md
          - contributing.md
        Tutorial:
          - tutorial/*.md
        Providers:
          - tutorial/providers/*.md
        Methodology:
          - methodology/*.md

markdown_extensions:
  - abbr
  - attr_list
  - md_in_html
  - tables
  - admonition
  - def_list
  - footnotes
  - toc:
      permalink: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.tilde
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      auto_append:
        - docs/_abbreviations
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
